<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Perubahan Musim</title>

<button class="btn-suhu" onclick="gantiMusim()">Lihat Suhu</button>



<div class="suhu-box" id="suhuBox">
  <p id="suhuText"></p>
</div>

<link rel="stylesheet" href="style.css">
</head>
<style>
 /* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  overflow:hidden;
}
.btn-link{
  text-decoration:none;
}

.btn-nav{
  padding:15px 40px;
  border:none;
  border-radius:30px;
  background:#1e1e1e;
  color:#fff;
  font-size:1.1rem;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 10px 25px rgba(0,0,0,.3);
}

.btn-nav:hover{
  background:#ff9800;
  transform:translateY(-3px);
}


/* ================= SCENE ================= */
section{
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

/* ================= BACKGROUND ================= */
.bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}

.trees{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
}

/* ================= CYCLIST ================= */
section .girl{
  position:absolute;
  bottom:80px;
  right:-300px;   /* start di luar kanan */
  width:300px;
  scale:0.65;
  z-index:3;
  pointer-events:none;
  animation: jalan 12s linear infinite;
}


@keyframes jalan{
  from{
    right:-300px;
  }
  to{
    right:90vw; /* bergerak ke kiri sampai keluar layar */
  }
}



/* ================= TITLE ================= */
.title{
  position:absolute;
  top:50px;
  width:100%;
  text-align:center;
  font-size:4rem;
  color:#fff;
  z-index:6;
  text-shadow:0 10px 30px rgba(0,0,0,.6);
}

/* ================= BUTTON ================= */
.btn-suhu{
  position:absolute;
  top:150px;
  left:50%;
  transform:translateX(-50%);
  padding:15px 40px;
  border-radius:30px;
  border:none;
  background:#222;
  color:#fff;
  font-size:1.2rem;
  z-index:7;
  cursor:pointer;
}

/* ================= SUHU BOX ================= */
.suhu-box{
  position:absolute;
  top:230px;
  left:50%;
  transform:translateX(-50%);
  padding:20px 40px;
  font-size:2rem;
  border-radius:20px;
  backdrop-filter:blur(15px);
  background:rgba(255,255,255,.15);
  color:#fff;
  display:none;
  z-index:7;
}

/* ================= OVERLAY ================= */
.overlay{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:0;
  transition:.8s;
  z-index:4;
}

/* ================= MUSIM GUGUR ================= */
.gugur .daun{
  background:rgba(255,165,0,0.25);
  opacity:1;
}

/* DAUN */
.leaves{
  position:absolute;
  inset:0;
  pointer-events:none;
  display:none;
  z-index:5;
}

.gugur .leaves{
  display:block;
}

.leaves img{
  width:60px;
  animation: daunJatuh 8s linear infinite;
}

@keyframes daunJatuh{
  0%{
    transform:translateY(-100px) rotate(0deg);
    opacity:0;
  }
  20%{ opacity:1; }
  100%{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

/* ================= MUSIM SALJU ================= */
.salju{
  filter:saturate(.7) brightness(1.1);
}

.salju .salju{
  background:linear-gradient(
    rgba(80,160,255,.55),
    rgba(180,230,255,.65)
  );
  opacity:1;
}

/* SALJU */
.snowflake{
  position:absolute;
  top:-10px;
  border-radius:50%;
  background:#fff;
  opacity:0;
  z-index:5;
}

.salju .snowflake{
  opacity:.9;
  animation: saljuJatuh linear infinite;
  animation-duration: 8s;
}


@keyframes saljuJatuh{
  to{
    transform:translateY(110vh);
  }
}

/* ================= MUSIM PANAS ================= */
.panas .panas{
  background:rgba(255,215,0,.35);
  opacity:1;
}

/* MATAHARI */
.sun{
  position:absolute;
  top:120px;
  left:50%;
  transform:translateX(-50%) scale(.5);
  width:160px;
  height:160px;
  background:radial-gradient(circle,#fffde7,#fbc02d);
  border-radius:50%;
  box-shadow:0 0 100px rgba(255,215,0,.9);
  opacity:0;
  transition:1s;
  z-index:5;
}

.panas .sun{
  opacity:1;
  transform:translateX(-50%) scale(1);
  animation:pulse 3s infinite alternate;
}

@keyframes pulse{
  from{
    box-shadow:0 0 60px rgba(255,215,0,.6);
  }
  to{
    box-shadow:0 0 110px rgba(255,235,59,1);
  }
}
/* BUTTON NAVIGASI PERTEMUAN */
.btn-pertemuan{
  position:absolute;
  top:150px;
  right:40px;

  padding:14px 36px;
  border-radius:30px;
  background:linear-gradient(135deg,#ff9800,#ff5722);
  color:#fff;

  font-size:1.05rem;
  font-weight:600;
  text-decoration:none;

  box-shadow:0 12px 30px rgba(0,0,0,.35);
  transition:.35s ease;
  z-index:8;
}

/* hover cantik */
.btn-pertemuan:hover{
  transform:translateY(-4px) scale(1.03);
  box-shadow:0 18px 40px rgba(0,0,0,.45);
}

/* klik */
.btn-pertemuan:active{
  transform:scale(.97);
}


</style>
<body>
<a href="index.html" class="btn-nav btn-pertemuan">
  Utama
</a>
<audio id="bgMusic" src="lagu.mp3" loop></audio>



<section id="scene" class="gugur">

  <!-- BACKGROUND -->
  <img src="bg.jpg" class="bg">
  <img src="trees.png" class="trees">

  <!-- ORANG BERSEPEDA (WAJIB ADA) -->
  <img src="girl.png" class="girl">

  <!-- EFEK MUSIM -->
  <div class="overlay daun"></div>
  <div class="overlay salju"></div>
  <div class="overlay panas"></div>

  <!-- BUTIR SALJU -->
<div class="snowflake" style="left:10%; animation-duration:8s; width:4px; height:4px"></div>
<div class="snowflake" style="left:30%; animation-duration:6s; width:6px; height:6px"></div>
<div class="snowflake" style="left:50%; animation-duration:7s; width:5px; height:5px"></div>
<div class="snowflake" style="left:70%; animation-duration:5s; width:3px; height:3px"></div>
<div class="snowflake" style="left:90%; animation-duration:9s; width:7px; height:7px"></div>

<!-- DAUN GUGUR -->
  <div class="leaves">
    <div class="set">
      <div><img src="leaf_01.png"></div>
      <div><img src="leaf_02.png"></div>
      <div><img src="leaf_03.png"></div>
      <div><img src="leaf_04.png"></div>
      <div><img src="leaf_01.png"></div>
      <div><img src="leaf_02.png"></div>
      <div><img src="leaf_03.png"></div>
      <div><img src="leaf_04.png"></div>
    </div>
  </div>

  <h1 class="title" id="judul">MUSIM GUGUR</h1>
  <!-- MATAHARI -->
<div class="sun"></div>


</section>

<script>
    document.addEventListener("click", function playOnce(){
  const music = document.getElementById("bgMusic");
  music.volume = 0.6;
  music.play();
  document.removeEventListener("click", playOnce);
});
const data = [
  { nama:"MUSIM GUGUR", suhu:"10°C", class:"gugur" },
  { nama:"MUSIM SALJU", suhu:"−18°C", class:"salju" },
  { nama:"MUSIM PANAS", suhu:"32°C", class:"panas" }
];

let i = 0;

function gantiMusim(){
  const scene = document.getElementById("scene");
  const judul = document.getElementById("judul");
  const box = document.getElementById("suhuBox");
  const text = document.getElementById("suhuText");
  // reset animasi daun & salju
document.querySelectorAll(".leaves").forEach(el=>{

  el.style.animation = "none";
  el.offsetHeight;
  el.style.animation = "";
});


  scene.className = data[i].class;
  judul.innerText = data[i].nama;
  text.innerText = data[i].suhu;
  box.style.display = "block";

  i = (i + 1) % data.length;
}
const cyclist = document.querySelector(".girl");

function ulangSepeda(){
  cyclist.style.animation = "none";
  cyclist.offsetHeight; // reset animasi
  cyclist.style.animation = "sepeda 12s linear forwards";
}

// ulang setiap 14 detik (halus, tidak terlihat mundur)
setInterval(ulangSepeda, 14000);

</script>

</body>
</html>
